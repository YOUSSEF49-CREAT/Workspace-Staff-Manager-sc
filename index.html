<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style.css">
    <title>workspace-staff-manager-sc | youssef faouzi</title>
</head>
<body>
   <form action="" class="form" id="form">

    <div class="worker-basic">
        <label>First name</label>
        <input type="text" id="fname" placeholder="first name">

        <label>Last name</label>
        <input type="text" id="lname" placeholder="last name">
    </div>

    
    <div class="worker-role">
        <label>Role</label>
        <select id="role-select">
            <option>Choose role</option>
            <option>it guy</option>
            <option>security</option>
            <option>reception</option>
            <option>cleaning</option>
            <option>manager</option>
            <option>nettoyage</option>
            <option>other</option>
        </select>
    </div>

  
    <div class="experience-section">
        <h3>Experience</h3>

        <label>Company</label>
        <input type="text" id="expcompany" placeholder="company">

        <label>Job Title</label>
        <input type="text" id="exprole" placeholder="what was your role">

        <label>Start Date</label>
        <input type="date" id="expfrom">

        <label>End Date</label>
        <input type="date" id="expto">

        <button type="button" id="add-experience">Add Experience</button>
    </div>

    <div id="experience_card"></div>

   
    <div class="worker-contact">
        <label>Phone</label>
        <input type="text" id="phone" placeholder="phone">

        <label>Email</label>
        <input type="text" id="email" placeholder="email">
    </div>
     <button id="closeForm" type="button">close</button>
    <button id="submit-form" type="button">ADD WORKER</button>
</form>


<div class="container">

   
    <div class="sidebar">
        <h1>WORKER</h1>
        <div class="cardsmall" id="cardsmall">
            
        </div>
        <button id="addworker">add worker</button>
    </div>

   
    <div class="main-content">
        <div class="rooms-wrapper">
            <div class="room-card" data-axcept-rols="nettoyage,other,manager" id="chamber_conference"  ><button id="conference_btn">+</button> conference</div>
            <div class="room-card" data-axcept-rols="reception,nettoyage,manager" id="chamber_reception"><button id="reception_btn">+</button>reception</div>
            <div class="room-card" data-axcept-rols="it guy,manager,nettoyage"  id="chamber_servers" ><button id="servers_btn">+</button>servers</div>
            <div class="room-card" data-axcept-rols="security,nettoyage,manager" id="chamber_security"><button  id="security_btn">+</button>security</div>
            <div class="room-card" data-axcept-rols="manager,nettoyage,other"><button>+</button>staff</div>
            <div class="room-card" data-axcept-rols="manager,other"><button>+</button>vault</div>
        </div>
    </div>

</div>

<div id="worker-modal" class="modal">
    <div class="modal-content">

        <span id="close-modal">&times;</span>

        <h2 id="modal-name"></h2>
        <p><strong>Role:</strong> <span id="modal-role"></span></p>
        <p><strong>Phone:</strong> <span id="modal-phone"></span></p>
        <p><strong>Email:</strong> <span id="modal-email"></span></p>

        <h3>Experience:</h3>
        <div id="modal-exp"></div>

    </div>
</div>

<div id="afihce_anfo">

</div>


<script src="/assets/main.js"></script>
</body>
</html>
